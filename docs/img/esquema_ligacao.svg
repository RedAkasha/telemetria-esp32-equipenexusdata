<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Esquema de ligação — Totem ByteBank Queue (ESP32 AM-032 com OLED)</title>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">Esquema de ligação — Totem ByteBank Queue</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#4b5563">Placa ESP32 AM-032 (OLED embutido) · fileira de pinos do lado do botão EN</text>

  <!-- Placa -->
  <rect x="40" y="80" width="920" height="150" rx="12" fill="#111827"/>
  <rect x="60" y="98" width="130" height="90" rx="4" fill="#1e3a8a"/>
  <text x="125" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#bfdbfe">OLED</text>
  <text x="125" y="158" text-anchor="middle" font-size="11" fill="#bfdbfe">SDA 5 · SCL 4</text>
  <text x="125" y="173" text-anchor="middle" font-size="11" fill="#bfdbfe">(ligado por dentro)</text>
  <rect x="300" y="100" width="150" height="80" rx="4" fill="#9ca3af"/>
  <text x="375" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">ESP32</text>
  <rect x="880" y="120" width="60" height="40" rx="4" fill="#6b7280"/>
  <text x="910" y="145" text-anchor="middle" font-size="11" fill="#f9fafb">USB</text>
  <text x="215" y="110" font-size="12" font-weight="700" fill="#fde047">AM-032</text>

  <!-- Fileira de pinos (ordem real da serigrafia) -->
  <g font-size="11" text-anchor="middle" fill="#fde047">
    <text x="230" y="214">VCC</text><text x="262" y="214">EN</text><text x="294" y="214">SVP</text>
    <text x="326" y="214">SVN</text><text x="358" y="214">34</text><text x="390" y="214">35</text>
    <text x="454" y="214">33</text><text x="486" y="214">25</text>
    <text x="518" y="214">26</text><text x="550" y="214">27</text><text x="582" y="214">14</text>
    <text x="614" y="214">12</text><text x="678" y="214">13</text>
    <text x="710" y="214">SD2</text><text x="742" y="214">SD3</text><text x="774" y="214">CMD</text>
    <text x="806" y="214">5V</text><text x="838" y="214">NC</text>
  </g>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <text x="422" y="214" fill="#60a5fa">32</text>
    <text x="454" y="214" fill="#e5e7eb">33</text>
    <text x="486" y="214" fill="#f87171">25</text>
    <text x="646" y="214" fill="#f9fafb">GND</text>
  </g>
  <g fill="#d1d5db">
    <circle cx="230" cy="226" r="4"/><circle cx="262" cy="226" r="4"/><circle cx="294" cy="226" r="4"/>
    <circle cx="326" cy="226" r="4"/><circle cx="358" cy="226" r="4"/><circle cx="390" cy="226" r="4"/>
    <circle cx="518" cy="226" r="4"/><circle cx="550" cy="226" r="4"/><circle cx="582" cy="226" r="4"/>
    <circle cx="614" cy="226" r="4"/><circle cx="678" cy="226" r="4"/><circle cx="710" cy="226" r="4"/>
    <circle cx="742" cy="226" r="4"/><circle cx="774" cy="226" r="4"/><circle cx="806" cy="226" r="4"/>
    <circle cx="838" cy="226" r="4"/>
  </g>
  <circle cx="422" cy="226" r="6" fill="#3b82f6"/>
  <circle cx="454" cy="226" r="6" fill="#f3f4f6"/>
  <circle cx="486" cy="226" r="6" fill="#ef4444"/>
  <circle cx="646" cy="226" r="6" fill="#111827" stroke="#f9fafb" stroke-width="2"/>
  <text x="358" y="252" text-anchor="middle" font-size="10" fill="#b91c1c">34/35: NÃO usar</text>
  <text x="358" y="264" text-anchor="middle" font-size="10" fill="#b91c1c">(sem pull-up)</text>

  <!-- Trilho GND da protoboard -->
  <line x1="60" y1="510" x2="940" y2="510" stroke="#2563eb" stroke-width="5"/>
  <text x="64" y="535" font-size="13" font-weight="700" fill="#1d4ed8">Trilho azul (−) da protoboard = GND</text>

  <!-- GND da placa até o trilho -->
  <polyline points="646,232 646,250 860,250 860,510" fill="none" stroke="#111827" stroke-width="3"/>
  <text x="868" y="400" font-size="12" font-weight="700" fill="#111827">GND → trilho</text>
  <text x="868" y="415" font-size="11" fill="#374151">(fio obrigatório)</text>

  <!-- Botão azul: GPIO 32 -->
  <polyline points="422,232 422,280 200,280 200,360" fill="none" stroke="#2563eb" stroke-width="3"/>
  <rect x="160" y="360" width="80" height="80" rx="6" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <circle cx="200" cy="400" r="24" fill="#2563eb"/>
  <circle cx="166" cy="366" r="4" fill="#374151"/><circle cx="234" cy="366" r="4" fill="#374151"/>
  <circle cx="166" cy="434" r="4" fill="#374151"/><circle cx="234" cy="434" r="4" fill="#374151"/>
  <polyline points="200,360 166,366" fill="none" stroke="#2563eb" stroke-width="3"/>
    <polyline points="234,434 234,510" fill="none" stroke="#111827" stroke-width="3"/>
  <text x="248" y="395" font-size="12" font-weight="700" fill="#1e3a8a">Botão azul</text>
  <text x="248" y="410" font-size="11" fill="#1e3a8a">CONVENCIONAL</text>
  <text x="210" y="274" font-size="11" fill="#1d4ed8">GPIO 32</text>

  <!-- Botão branco: GPIO 33 -->
  <polyline points="454,232 454,320 420,320 420,360" fill="none" stroke="#6b7280" stroke-width="3"/>
  <rect x="380" y="360" width="80" height="80" rx="6" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <circle cx="420" cy="400" r="24" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <circle cx="386" cy="366" r="4" fill="#374151"/><circle cx="454" cy="366" r="4" fill="#374151"/>
  <circle cx="386" cy="434" r="4" fill="#374151"/><circle cx="454" cy="434" r="4" fill="#374151"/>
  <polyline points="420,360 386,366" fill="none" stroke="#6b7280" stroke-width="3"/>
  <polyline points="454,434 454,510" fill="none" stroke="#111827" stroke-width="3"/>
  <text x="468" y="395" font-size="12" font-weight="700" fill="#374151">Botão branco</text>
  <text x="468" y="410" font-size="11" fill="#374151">PRIORITÁRIA</text>
  <text x="462" y="345" font-size="11" fill="#4b5563">GPIO 33</text>

  <!-- Buzzer: GPIO 25 -->
  <polyline points="486,232 486,270 640,270 640,370" fill="none" stroke="#dc2626" stroke-width="3"/>
  <circle cx="660" cy="400" r="34" fill="#1f2937"/>
  <circle cx="660" cy="400" r="5" fill="#9ca3af"/>
  <text x="640" y="380" text-anchor="middle" font-size="14" font-weight="700" fill="#f87171">+</text>
  <polyline points="680,430 680,510" fill="none" stroke="#111827" stroke-width="3"/>
  <text x="700" y="403" font-size="12" font-weight="700" fill="#111827">Buzzer</text>
  <text x="700" y="380" font-size="11" fill="#b91c1c">perna + → GPIO 25</text>
  <text x="700" y="470" font-size="11" fill="#111827">perna − → trilho</text>

  <!-- Nota sobre pernas do botão -->
    <text x="500" y="555" text-anchor="middle" font-size="11" fill="#374151">Botão de 4 pernas: use pernas em DIAGONAL (um canto no GPIO, o canto oposto no GND) — o PULL_UP interno dispensa resistor.</text>
</svg>
